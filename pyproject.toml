[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apkgen"
version = "0.2.0"
description = "Gradle-free generator for mass Android launcher test apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1"]

[project.scripts]
apkgen = "apkgen.cli:main"

[tool.setuptools.packages.find]
include = ["apkgen*"]

[tool.setuptools.package-data]
"*" = ["*.tmpl"]
